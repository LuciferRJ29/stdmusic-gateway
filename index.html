<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STD MUSIC • Cloud Gateway</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d0e15;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: linear-gradient(145deg, #181926, #12131e);
            border: 1px solid #00E676;
            border-radius: 24px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 230, 118, 0.15);
        }
        .badge {
            display: inline-block;
            background: rgba(0, 230, 118, 0.15);
            color: #00E676;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 230, 118, 0.3);
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        p {
            color: #9E9EB2;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .info-box {
            background: #0f1019;
            border-radius: 14px;
            padding: 16px;
            text-align: left;
            margin-bottom: 25px;
            font-size: 14px;
            border: 1px solid #23253a;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .info-row:last-child { margin-bottom: 0; }
        .label { color: #828399; }
        .val { color: #00E676; font-weight: 600; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: #00E676;
            color: #0a0b10;
            font-size: 15px;
            font-weight: 700;
            border-radius: 14px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 230, 118, 0.35);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">🟢 ACTIVE GATEWAY</div>
        <h1>STD MUSIC API</h1>
        <p>Dynamic Load Gateway & High-Speed Stream Router for STD MUSIC Android VIP.</p>
        
        <div class="info-box">
            <div class="info-row">
                <span class="label">Gateway Status:</span>
                <span class="val">Operational</span>
            </div>
            <div class="info-row">
                <span class="label">Protocol:</span>
                <span class="val">Edge Dynamic Routing</span>
            </div>
            <div class="info-row">
                <span class="label">Developer:</span>
                <span class="val">STD DEEPANSHU</span>
            </div>
        </div>

        <a href="/api/config" class="btn">Check Active Server Config</a>
    </div>
</body>
</html>
